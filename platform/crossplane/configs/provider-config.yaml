# Authenticates through AKS workload identity; no client secret exists.
# The ${...} values are substituted by Flux from the idp-platform-settings ConfigMap.
apiVersion: azure.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
spec:
  credentials:
    source: OIDCTokenFile
  clientID: ${CROSSPLANE_CLIENT_ID}
  tenantID: ${AZURE_TENANT_ID}
  subscriptionID: ${AZURE_SUBSCRIPTION_ID}
