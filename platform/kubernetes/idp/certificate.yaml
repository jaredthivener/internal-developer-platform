# The Gateway's certificate: AKS issues a publicly trusted wildcard certificate
# for the cluster's app routing default domain (*.<id>.<region>.aksapp.io),
# renews it, and keeps it in the Secret idp-web-tls in this namespace.
apiVersion: approuting.kubernetes.azure.com/v1alpha1
kind: DefaultDomainCertificate
metadata:
  name: idp-web-tls
  namespace: idp-system
spec:
  target:
    secret: idp-web-tls
