# Public entry point: the AKS application routing Gateway API implementation
# (GatewayClass approuting-istio). INGRESS_HOST is a host under the cluster's
# app routing default domain; the managed external-dns publishes its A record
# from the HTTPRoutes, and TLS uses the managed certificate from
# certificate.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: idp-web
  namespace: idp-system
spec:
  gatewayClassName: approuting-istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
    - name: https
      port: 443
      protocol: HTTPS
      hostname: ${INGRESS_HOST}
      tls:
        mode: Terminate
        certificateRefs:
          - name: idp-web-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: idp-web
  namespace: idp-system
spec:
  parentRefs:
    - name: idp-web
      sectionName: https
  hostnames:
    - ${INGRESS_HOST}
  rules:
    - backendRefs:
        - name: idp-web
          port: 80
---
# Plain HTTP only redirects; session cookies are Secure and never sent over it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: idp-web-https-redirect
  namespace: idp-system
spec:
  parentRefs:
    - name: idp-web
      sectionName: http
  hostnames:
    - ${INGRESS_HOST}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
