apiVersion: apps/v1
kind: Deployment
metadata:
  name: idp-web
  namespace: idp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: idp-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: idp-web
        azure.workload.identity/use: 'true'
    spec:
      serviceAccountName: idp-web
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/arch: ${WORKLOAD_ARCH}
        kubernetes.io/os: linux
      containers:
        - name: idp-web
          image: ${IMAGE_REF}
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: idp-app-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            # The root filesystem is read-only; Next.js writes its cache here.
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
