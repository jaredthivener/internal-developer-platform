name: App CI

on:
  pull_request:
    paths-ignore:
      - docs/**
  push:
    branches:
      - main
    paths-ignore:
      - docs/**
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test

      - name: Deploy Script Checks
        run: |
          shellcheck -x -S warning scripts/azure/*.sh
          bash scripts/azure/scripts.test.sh

      # Same Flux version as the microsoft.flux extension (1.26.x).
      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@v2.9.6
        with:
          version: 2.9.6

      - name: GitOps Manifest Checks
        run: bash scripts/azure/gitops.test.sh

      - name: Build App
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-End Smoke Tests
        run: npm run test:e2e
